name: Fork tests (Aave V3, manual)

on:
  workflow_dispatch:

jobs:
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge test (fork)
        run: forge test --match-path "test/fork/*" --fork-url "$AVALANCHE_MAINNET_RPC_URL" -vv
        env:
          AVALANCHE_MAINNET_RPC_URL: ${{ secrets.AVALANCHE_MAINNET_RPC_URL }}
