[profile.default]
src = "contracts"
test = "test"
script = "scripts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployment" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
avalanche = "${AVALANCHE_MAINNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
ignore = ["test/**/*.sol", "scripts/**/*.sol"]
